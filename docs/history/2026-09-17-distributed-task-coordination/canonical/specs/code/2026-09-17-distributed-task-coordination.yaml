# spec.yaml - 行为规格（Canonical YAML）
meta:
  capability: "distributed-task-coordination"
  change_id: "2026-09-17-distributed-task-coordination"
  created: "2026-09-17T10:45:00+08:00"
  confidence: high

requirements:
  - id: REQ-001
    description: "分布式任务必须以服务器 Git 裸库作为唯一数据面真值源，控制面不得取代 Change 事实"
    scenarios:
      - id: SC-001
        confidence: high
        evidence: "设计决策：master 集成线与 task/<task_id> 分支；控制面可从 Git 重建"
        given: "服务器裸库可通过 git-over-SSH 访问"
        when: "节点创建或更新一个分布式任务"
        then: "任务 SHALL 关联 parent_change_id、base_git_sha 和可审计的 task 分支"
        and:
          - "控制面 SHALL NOT 直接修改 Change 的 current_phase/status"
          - "Git commit/ref SHALL 是产出的权威记录"
      - id: SC-002
        confidence: high
        evidence: "唯一真值源规则"
        given: "控制面 SQLite 与 Git 数据均可读取"
        when: "控制面数据库被删除后重建"
        then: "系统 SHALL 能从 Git 分支、Change .fstdd.yaml 和产物重建任务索引"

  - id: REQ-002
    description: "任务必须以子 Change 为跨机分派边界，并拥有单一 owner 与隔离工作区"
    scenarios:
      - id: SC-003
        confidence: high
        evidence: "共享 slices_completed 会产生多机写冲突"
        given: "一个父 Change 被拆成多个可独立执行的工作项"
        when: "系统生成任务"
        then: "每个跨机任务 SHALL 关联一个 child_change_id 或明确的子 Change 目录"
        and:
          - "同一任务 SHALL 同时只有一个有效 owner"
          - "任务 worktree SHALL 位于任何 Git checkout 之外"
      - id: SC-004
        confidence: high
        evidence: "delegate-slice 的 scope/isolation/disjoint 原则"
        given: "两个任务声明了 scope"
        when: "系统准备允许并行执行"
        then: "只有 scope 不重叠、接口不需要串行交接且 worktree 隔离时 SHALL 允许并行"
        and:
          - "scope 重叠 SHALL 强制串行"

  - id: REQ-003
    description: "控制面必须提供可恢复的任务状态、节点注册、心跳与租约"
    scenarios:
      - id: SC-005
        confidence: high
        evidence: "需求：6 agent / 3 台机器，需要在线状态和掉线回收"
        given: "节点携带唯一 node_id、能力标签和 SSH 公钥指纹"
        when: "节点调用注册接口"
        then: "服务 SHALL 幂等创建或更新节点，并记录 last_seen/status"
      - id: SC-006
        confidence: high
        evidence: "租约回收要求"
        given: "任务处于 claimed/running 且 lease 已过期"
        when: "其他节点查询任务池"
        then: "服务 SHALL 将该任务回收为 pending 或标记为需人工处理"
        and:
          - "旧 owner 使用旧 lease token 回传 SHALL 被拒绝"
      - id: SC-007
        confidence: high
        evidence: "SQLite 标准库与事务设计"
        given: "两个节点同时领取可用任务"
        when: "两个 claim 请求并发到达"
        then: "同一任务 SHALL 只被一个节点领取"
        and:
          - "另一请求 SHALL 得到无任务或冲突响应"
          - "数据库 SHALL 保留一次 claim 的 owner/lease/attempt"

  - id: REQ-004
    description: "所有控制面写操作必须具备幂等键，能够抵抗网络重试和 SSH 双执行"
    scenarios:
      - id: SC-008
        confidence: high
        evidence: "本机经 SSH 的命令可能执行两次"
        given: "同一 idempotency_key 的创建或回传请求重复提交"
        when: "服务处理第二次请求"
        then: "服务 SHALL 返回首次处理结果且 SHALL NOT 创建重复任务、消息或完成记录"
      - id: SC-009
        confidence: high
        evidence: "消息传递需要可重试"
        given: "两个不同 payload 使用相同幂等键"
        when: "第二个请求到达"
        then: "服务 SHALL 返回冲突并保留首次 payload"

  - id: REQ-005
    description: "8788 必须是内部控制面，与 8787 公网经验回传端点隔离"
    scenarios:
      - id: SC-010
        confidence: high
        evidence: "8787 无鉴权、只写、公网暴露；威胁模型不同"
        given: "服务部署在同一台服务器"
        when: "检查监听地址、systemd unit 和数据目录"
        then: "8788 SHALL 只监听 127.0.0.1，使用独立 unit、端口和 SQLite 数据目录"
        and:
          - "8787 的现有路由和数据目录 SHALL 不被改造或复用为任务总线"
      - id: SC-011
        confidence: high
        evidence: "SSH 作为身份验证和访问通道"
        given: "节点没有新的公网 token"
        when: "节点访问 8788"
        then: "节点 SHALL 通过 SSH 命令或 SSH 端口转发访问控制面"
        and:
          - "私钥 SHALL NOT 写入仓库或任务载荷"

  - id: REQ-006
    description: "FSTDD phase、Gate 与分布式协调状态必须隔离且可审计"
    scenarios:
      - id: SC-012
        confidence: high
        evidence: "宪法：Gate 必须人工确认；.fstdd.yaml 禁止手改 phase/status"
        given: "任务状态变为 done"
        when: "节点回传完成"
        then: "系统 SHALL NOT 自动确认 Gate、推进 phase 或归档 Change"
        and:
          - "只有受控 FSTDD CLI 和 D哥明确确认才能完成 Gate"
      - id: SC-013
        confidence: high
        evidence: "历史审计字段不可被幂等重试覆盖"
        given: "Gate 已存在 confirmed_at 且原 confirmed_actor 为 ai"
        when: "用户要对历史 Gate 作追认"
        then: "`gate amend-audit` SHALL 追加 audit_amendments[]，不得覆盖原始审计字段"
        and:
          - "命令 SHALL 要求非空 evidence、确认通道和 amended_actor=user"
          - "相同幂等键 SHALL 幂等；不同证据 SHALL 报冲突"

  - id: REQ-007
    description: "任务间消息必须支持提问、阻塞上报、状态通知与确认回执"
    scenarios:
      - id: SC-014
        confidence: high
        evidence: "用户需求：信息交流与完成回传"
        given: "节点需要请求上下文或报告阻塞"
        when: "节点提交带 task_id 的消息"
        then: "消息 SHALL 记录 message_id、conversation_id、from_node_id、kind、body 和 created_at"
        and:
          - "消息 SHALL 可按 node_id/task_id 拉取"
          - "重复投递 SHALL 由幂等键去重"
      - id: SC-015
        confidence: high
        evidence: "消息可靠性要求"
        given: "接收节点已读取一条消息"
        when: "节点提交 ack"
        then: "服务 SHALL 记录 ack 时间且不得再次返回已确认消息"

  - id: REQ-008
    description: "所有并行产出必须经过串行集成和可验证的失败处理"
    scenarios:
      - id: SC-016
        confidence: high
        evidence: "Integration stays serial；master 单写者"
        given: "多个任务分支均已回传 result_git_sha"
        when: "集成者准备更新 master"
        then: "集成者 SHALL 逐任务审 diff、运行验证并串行合并"
        and:
          - "冲突 SHALL 将任务置为 blocked，不得强推 master"
          - "GitHub 镜像失败 SHALL NOT 阻塞服务器裸库内部流转"
