# Canonical Proposal (YAML-first, V2.9)

meta:
  change_id: "2026-09-18-integration-remote-check"
  title: "集成只检查本地状态：本地干净不等于可以集成，推送时才炸且已分叉"
  created: "2026-09-18T10:20:00+08:00"
  status: draft
  version: "2.9"

why:
  problem: |
    `integrate_task_branch` 的准入检查 `ensure_clean_target` 只看**本地**：
    在 target 分支上 + 无未提交改动，就放行。多机协作下这个假设不成立 ——
    别的机器可能已经推送了新提交，而本地工作区依然是干净的。

    后果链条（实测）：
      本地看着干净 -> ensure_clean_target 放行 -> `merge --ff-only` 本地成功
      -> **推送被拒**（fetch first）-> **本地 master 已与远端分叉**，
         必须手动 rebase 才能重来。

    问题不在于「最终会失败」，而在于**失败得太晚且状态已脏**：
    集成阶段报成功，把人骗过去；等推送时才炸，此时本地分支已经脏了，
    恢复成本远高于集成前拦一下。

    根因：准入检查缺少「远端视角」。本地干净是必要条件，不是充分条件。
  evidence:
    observed_at: "2026-09-18T10:10:00+08:00"
    observed_base_git_sha: "93f9dac"
    details: |
      双机探针（裸库 + 两个 clone 模拟两台机器，脚本已跑通并已清理）：

        A: task/a 提交 -> 集成 -> 推送成功，远端 master 前进到 28b995c
        B: 本地 master c6d4c34，本地 origin/master 也还是 c6d4c34（未 fetch）
           远端真实 master 已是 28b995c，但 B 不 fetch 就看不到
        B 集成 -> ✅ 本地成功 {'before_sha': 'c6d4c34...', 'after_sha': '68b7ca78...'}
           （ensure_clean_target 给了绿灯）
        B 推送 -> rc=1
           ! [rejected] master -> master (fetch first)
        B 本地 master 已与远端分叉，须手动 rebase

      对照：B 若在集成前 fetch，可立刻发现自己落后 1 个提交 —— 集成前就能拦住。

      另：`tools/fstdd_git.py` 全文没有任何 fetch / pull / ls-remote，
      整个模块对远端状态完全无感知。

what_changes:
  - description: "新增 ensure_target_up_to_date()：集成前 fetch 并比对本地 target 与上游，落后则拦下并给出明确指引"
  - description: "ensure_clean_target / integrate_task_branch 增加 check_remote 开关（默认开启）"
  - description: "无 upstream 的纯本地仓库直接放行 —— 不破坏离线与单机使用"
  - description: "fetch 失败时拒绝集成（远端状态未知），并提示可显式绕过；fetch 带 GIT_TERMINAL_PROMPT=0 防止卡在交互式凭据输入"
  - description: "CLI 增加 --no-check-remote 开关"
  - description: "补 3 条测试，含 make_remote_pair 双机夹具（裸库 + 两个 clone）"

capabilities:
  new: []
  modified:
    - name: "任务分支集成"
      description: "集成前校验远端一致性，避免本地假绿灯导致推送分叉"

