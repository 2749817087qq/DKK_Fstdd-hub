  - "被拦时本地 target 分支未被改动（不产生需要 rebase 的分叉）"
  - "check_remote=False 可显式绕过"
  - "无 upstream 的纯本地仓库集成不受影响"
  - "既有 51 条用例不回归，新增 3 条（共 54 passed）"
