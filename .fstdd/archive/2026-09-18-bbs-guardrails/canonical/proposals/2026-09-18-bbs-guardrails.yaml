meta:
  change_id: "2026-09-18-bbs-guardrails"
  title: "留言板护栏：封住 ack 删帖与孤儿留言两个数据面缺口"
  created: "2026-09-17T18:18:42+00:00"
  status: draft
  version: "2.9"

why:
  problem: |
    任务留言板（BBS）功能已交付并归档，但 QA 独立验证给出「有条件 Go」，两个
    🟠 级问题未修：

    1. ack_message 是唯一能让整条讨论串从所有人眼前消失的操作，却零测试覆盖，
       且服务端对 to_node_id IS NULL 的留言不做任何 ack 权限校验 —— 等于把
       「删帖」权限默认开放给了每一个注册节点。目前唯一的防线是 docstring 里
       一句话，属于「靠人不犯错」的设计。
    2. messages.task_id 的外键声明了但从未生效：PRAGMA foreign_keys=ON 只写在
       SCHEMA 里，而 connect_db 未设置。SQLite 的 foreign_keys 是连接级 pragma、
       默认 OFF，所以所有请求连接都没开。task_id 打错一个字会静默生成孤儿留言，
       在任何任务下都看不到，且无任何报错。

    两者都不影响「BBS 能用」，但都属于护栏缺失：一旦有多个 agent 自动接入，
    误用概率会显著上升。
  evidence:
    observed_at: "2026-09-17T18:18:42+00:00"
    observed_base_git_sha: "b396602"
    details: |
      QA 实测（2026-09-18，change 2026-09-18-task-thread-bbs 独立验证报告）：
      - 变异测试 B7/B8/B9 三个变异体全部存活：把 ack_message 的路径改成 /ack2、
        删掉 node_id 必填校验，测试一律 23 passed 不变 —— 零覆盖确认。
      - 服务端 _ack 只在 to_node_id 非空且不等于 node_id 时拒绝；BBS 留言的
        to_node_id 恒为 NULL，故任何已注册节点都能 ack 任何一条 BBS 留言。
      - POST /messages 带 task_id=task-DOES-NOT-EXIST → HTTP 201 接受，
        生成孤儿留言（实测 message_id 已记录）。
      - 静态：fstdd_hub.py 中 PRAGMA foreign_keys=ON 只出现在 SCHEMA 常量里；
        connect_db 只设了 busy_timeout，未设 foreign_keys。
      - 缓解事实：ack 是软删除，实测 DB 行仍在，可手工恢复，不是物理丢失。

what_changes:
  - description: "connect_db 增加 PRAGMA foreign_keys=ON，让 SCHEMA 已声明的外键真正生效（契约与代码一致）"
  - description: "_message 增加 task_id 显式存在性校验，返回明确的 400 task not found 而非 201 静默接受"
  - description: "_ack 把 task_id 非空且 to_node_id 为空的留言（即讨论串）的 ack 权限从任一注册节点收窄到仅作者 —— 不能一刀切禁止，既有 blocker 工作流数据形态与之完全相同且依赖自我 ack"
  - description: "补 ack_message 的 3 条单元测试（路径 / payload / node_id 必填），杀掉 QA 的 B7/B8/B9 变异体"
  - description: "看板渲染修复：body 同时归一 CRLF/CR/LF（Windows 多行留言会破坏版面）；截断超长留言补省略号"

